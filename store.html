<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Group Order | The Northern Threads</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="./" data-brand>The Northern Threads</a>
      <nav class="nav-links"><a class="btn btn-small" href="./#quote">Get merch for your org</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="store-head">
      <p class="eyebrow" id="store-org">Group order</p>
      <h1 id="store-title">Loading...</h1>
      <p class="lede" id="store-blurb"></p>
      <div class="store-meta" id="store-meta"></div>
      <div id="store-progress"></div>
      <div id="store-notices"></div>
    </section>
    <section class="products" id="products" aria-label="Products"></section>
  </main>

  <footer class="footer">
    <div class="wrap">
      <p><strong data-brand>The Northern Threads</strong> · <span data-campus>Oxford, OH</span></p>
      <p class="muted" id="store-terms">Pay securely by card. If this order doesn't reach its minimum, everyone is refunded in full.</p>
      <p class="muted" id="footer-contact"></p>
    </div>
  </footer>

  <script type="module" src="assets/js/store.js"></script>
</body>
</html>
